# AeroSpace config
# References:
# - https://nikitabobko.github.io/AeroSpace/guide
# - https://nikitabobko.github.io/AeroSpace/commands

config-version = 2

# Startup
after-startup-command = []
start-at-login = true

# Windows Management

# The official default keeps normalizations enabled because they prevent odd
# tree shapes. Use join-with for explicit grouping when needed.
enable-normalization-flatten-containers = true
enable-normalization-opposite-orientation-for-nested-containers = true

accordion-padding = 16
default-root-container-layout = 'tiles'
default-root-container-orientation = 'auto'

# Keep cmd-h hidden windows visible to AeroSpace
automatically-unhide-macos-hidden-apps = true

# Keep numbered workspaces present even when empty
persistent-workspaces = ["1", "2", "3", "4", "5", "6", "7", "8", "9"]

# Mouse follows the focused monitor
on-focused-monitor-changed = ['move-mouse monitor-lazy-center']

# A callback that runs every time binding mode changes
# See: https://nikitabobko.github.io/AeroSpace/guide#binding-modes
# See: https://nikitabobko.github.io/AeroSpace/commands#mode
on-mode-changed = []

# Input
[key-mapping]
  preset = 'qwerty'

# Gaps
[gaps]
  inner.horizontal = 8
  inner.vertical =   8
  outer.left =       8
  outer.bottom =     8
  outer.top =        8
  outer.right =      8

########################################
### Main Mode
########################################
[mode.main.binding]
  # Focus
  alt-h = 'focus left'
  alt-j = 'focus down'
  alt-k = 'focus up'
  alt-l = 'focus right'

  # Move windows
  alt-shift-h = 'move left'
  alt-shift-j = 'move down'
  alt-shift-k = 'move up'
  alt-shift-l = 'move right'

  # Layout
  alt-g = 'layout horizontal'
  alt-v = 'layout vertical'
  alt-f = 'fullscreen'
  alt-s = 'layout v_accordion'
  alt-w = 'layout h_accordion'
  alt-e = 'layout tiles vertical'
  alt-shift-space = 'layout floating tiling'

  # Workspaces
  alt-1 = 'workspace 1'
  alt-2 = 'workspace 2'
  alt-3 = 'workspace 3'
  alt-4 = 'workspace 4'
  alt-5 = 'workspace 5'
  alt-6 = 'workspace 6'
  alt-7 = 'workspace 7'
  alt-8 = 'workspace 8'
  alt-9 = 'workspace 9'

  alt-shift-1 = 'move-node-to-workspace 1'
  alt-shift-2 = 'move-node-to-workspace 2'
  alt-shift-3 = 'move-node-to-workspace 3'
  alt-shift-4 = 'move-node-to-workspace 4'
  alt-shift-5 = 'move-node-to-workspace 5'
  alt-shift-6 = 'move-node-to-workspace 6'
  alt-shift-7 = 'move-node-to-workspace 7'
  alt-shift-8 = 'move-node-to-workspace 8'
  alt-shift-9 = 'move-node-to-workspace 9'

  alt-tab = 'workspace-back-and-forth'
  alt-shift-tab = 'move-workspace-to-monitor --wrap-around next'

  # Monitors
  alt-ctrl-h = 'focus-monitor left'
  alt-ctrl-j = 'focus-monitor down'
  alt-ctrl-k = 'focus-monitor up'
  alt-ctrl-l = 'focus-monitor right'

  alt-ctrl-shift-h = 'move-workspace-to-monitor --wrap-around left'
  alt-ctrl-shift-j = 'move-workspace-to-monitor --wrap-around down'
  alt-ctrl-shift-k = 'move-workspace-to-monitor --wrap-around up'
  alt-ctrl-shift-l = 'move-workspace-to-monitor --wrap-around right'

  # Resize
	alt-r = 'mode resize'
  alt-minus = 'resize smart -50'
  alt-equal = 'resize smart +50'

  # Service
  alt-shift-f = 'macos-native-fullscreen'
  alt-shift-c = 'reload-config'
  alt-shift-semicolon = 'mode service'

  # Modes
	alt-a = 'mode apps'

########################################
### App Mode
########################################
[mode.apps.binding]
	# f = ['exec-and-forget open -a /Applications/Zen.app', 'mode main']
	# d = ['exec-and-forget open -a /Applications/AppName.app', 'mode main']
	# s = ['exec-and-forget open -a /Applications/AppName.app', 'mode main']
	# a = ['exec-and-forget open -a /Applications/AppName.app', 'mode main']
	# h = ['exec-and-forget open -a /Applications/Figma.app', 'mode main']
	# j = ['exec-and-forget open -a /Applications/AppName.app', 'mode main']
	# k = ['exec-and-forget open -a /Applications/AppName.app', 'mode main']
	# l = ['exec-and-forget open -a /Applications/AppName.app', 'mode main']

	t = ['exec-and-forget open -a /Applications/Telegram.app', 'mode main']
  o = ['exec-and-forget open -a /System/Library/CoreServices/Finder.app', 'mode main']
  p = ['exec-and-forget open -a /Applications/Session.app', 'mode main']
	m = ['exec-and-forget open -a /Applications/Spotify.app', 'mode main']

	esc   = 'mode main'
	enter = 'mode main'

########################################
### Resize Mode
########################################
[mode.resize.binding]
	h = 'resize width -50'
	l = 'resize width +50'
	j = 'resize height +50'
	k = 'resize height -50'

	# Fine-grained 
	shift-h = 'resize width -10'
	shift-l = 'resize width +10'
	shift-j = 'resize height +10'
	shift-k = 'resize height -10'

	esc   = 'mode main'
	enter = 'mode main'

########################################
### Service Mode
########################################
[mode.service.binding]
	esc = ['reload-config', 'mode main']
	r = ['flatten-workspace-tree', 'mode main'] 
	f = ['layout floating tiling', 'mode main'] 
	backspace = ['close-all-windows-but-current', 'mode main']

	alt-shift-h = ['join-with left', 'mode main']
	alt-shift-j = ['join-with down', 'mode main']
	alt-shift-k = ['join-with up', 'mode main']
	alt-shift-l = ['join-with right', 'mode main']

########################################
### Window Rules: Workspaces
########################################

# Workspace 1
[[on-window-detected]]
  if.app-id = 'app.zen-browser.zen'
  run = 'move-node-to-workspace 1'

# Workspace 2
[[on-window-detected]]
  if.app-id = 'com.figma.Desktop'
  run = 'move-node-to-workspace 2'

# Workspace 3
[[on-window-detected]]
  if.app-id = 'com.microsoft.VSCode'
  run = 'move-node-to-workspace 3'

# Workspace 4
[[on-window-detected]]
  if.app-id = 'notion.id'
  run = 'move-node-to-workspace 4'

# Workspace 5
[[on-window-detected]]
  if.app-id = 'ru.keepcoder.Telegram'
  run = 'move-node-to-workspace 5'

[[on-window-detected]]
  if.app-id = 'com.apple.mail'
  run = 'move-node-to-workspace 5'

# Workspace 6
[[on-window-detected]]
  if.app-id = 'us.zoom.xos'
  run = 'move-node-to-workspace 6'

# Workspace 9
[[on-window-detected]]
  if.app-id = 'com.spotify.client'
  run = 'move-node-to-workspace 9'

########################################
