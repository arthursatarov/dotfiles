[[on-window-detected]]
  if.app-id = 'com.dominiklevitsky.fontbase'
  run = ['layout floating', 'move-node-to-workspace design']

# code (alt-6)
[[on-window-detected]]
  if.app-id = 'com.microsoft.VSCode'
  run = 'move-node-to-workspace code'

[[on-window-detected]]
