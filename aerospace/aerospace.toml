# AeroSpace config
# References:
# - https://nikitabobko.github.io/AeroSpace/guide
# - https://nikitabobko.github.io/AeroSpace/commands

config-version = 2

# Startup
start-at-login = true
after-startup-command = []

# Windows Management

# The official default keeps normalizations enabled because they prevent odd
# tree shapes. Use join-with for explicit grouping when needed.
enable-normalization-flatten-containers = true
enable-normalization-opposite-orientation-for-nested-containers = true

accordion-padding = 16
default-root-container-layout = 'tiles'
default-root-container-orientation = 'auto'

# Keep cmd-h hidden windows visible to AeroSpace
automatically-unhide-macos-hidden-apps = true

# Keep workspaces present even when empty
persistent-workspaces = ["web", "notes", "docs", "chat", "design", "code", "term", "ai"]

# Mouse follows the focused monitor
on-focused-monitor-changed = ['move-mouse monitor-lazy-center']

# A callback that runs every time binding mode changes
# See: https://nikitabobko.github.io/AeroSpace/guide#binding-modes
# See: https://nikitabobko.github.io/AeroSpace/commands#mode
on-mode-changed = []

# Input
[key-mapping]
  preset = 'qwerty'

# Gaps
[gaps]
  inner.horizontal = 8
  inner.vertical =   8
  outer.left =       8
  outer.bottom =     8
  outer.top =        8
  outer.right =      8

########################################
### Main Mode
########################################
[mode.main.binding]
  # Focus
  alt-h = 'focus left'
  alt-j = 'focus down'
  alt-k = 'focus up'
  alt-l = 'focus right'

  # Move windows
  alt-shift-h = 'move left'
  alt-shift-j = 'move down'
  alt-shift-k = 'move up'
  alt-shift-l = 'move right'

  # Layout
  alt-g = 'layout horizontal'
  alt-v = 'layout vertical'
  alt-f = 'fullscreen'
  alt-s = 'layout v_accordion'
  alt-w = 'layout h_accordion'
  alt-e = 'layout tiles vertical'
  alt-shift-space = 'layout floating tiling'

  # Windows
  alt-shift-q = 'close'

  # Workspaces
  alt-1 = 'workspace web'
  alt-2 = 'workspace notes'
  alt-3 = 'workspace docs'
  alt-4 = 'workspace chat'
  alt-5 = 'workspace design'
  alt-6 = 'workspace code'
  alt-7 = 'workspace term'
  alt-8 = 'workspace ai'
  alt-9 = 'workspace 9'

  alt-shift-1 = 'move-node-to-workspace web'
  alt-shift-2 = 'move-node-to-workspace notes'
  alt-shift-3 = 'move-node-to-workspace docs'
  alt-shift-4 = 'move-node-to-workspace chat'
  alt-shift-5 = 'move-node-to-workspace design'
  alt-shift-6 = 'move-node-to-workspace code'
  alt-shift-7 = 'move-node-to-workspace term'
  alt-shift-8 = 'move-node-to-workspace ai'
  alt-shift-9 = 'move-node-to-workspace 9'

  alt-tab = 'workspace-back-and-forth'
  alt-shift-tab = 'move-workspace-to-monitor --wrap-around next'

  # Monitors
  alt-ctrl-h = 'focus-monitor left'
  alt-ctrl-j = 'focus-monitor down'
  alt-ctrl-k = 'focus-monitor up'
  alt-ctrl-l = 'focus-monitor right'

  alt-ctrl-shift-h = 'move-workspace-to-monitor --wrap-around left'
  alt-ctrl-shift-j = 'move-workspace-to-monitor --wrap-around down'
  alt-ctrl-shift-k = 'move-workspace-to-monitor --wrap-around up'
  alt-ctrl-shift-l = 'move-workspace-to-monitor --wrap-around right'

  # Resize
  alt-r = 'mode resize'
  alt-minus = 'resize smart -50'
  alt-equal = 'resize smart +50'

  # Service
  alt-shift-f = 'macos-native-fullscreen'
  alt-shift-c = 'reload-config'
  alt-shift-semicolon = 'mode service'

  # Modes
  alt-a = 'mode apps'

  # Terminal
  alt-enter = ['workspace term', 'exec-and-forget open -a /Applications/Ghostty.app']

########################################
### App Mode
########################################
[mode.apps.binding]
  b = ['exec-and-forget open -a "/Applications/Zen.app"', 'mode main']
  n = ['exec-and-forget open -a "/Applications/Notion.app"', 'mode main']
  o = ['exec-and-forget open -a "/Applications/Obsidian.app"', 'mode main']
  t = ['exec-and-forget open -a "/Applications/Ghostty.app"', 'mode main']
  c = ['exec-and-forget open -a "/Applications/Visual Studio Code.app"', 'mode main']
  f = ['exec-and-forget open -a "/Applications/Figma.app"', 'mode main']
  m = ['exec-and-forget open -a "/Applications/Telegram.app"', 'mode main']
  d = ['exec-and-forget open -a /System/Library/CoreServices/Finder.app', 'mode main']

  esc   = 'mode main'
  enter = 'mode main'

########################################
### Resize Mode
########################################
[mode.resize.binding]
  h = 'resize width -50'
  l = 'resize width +50'
  j = 'resize height +50'
  k = 'resize height -50'

  # Fine-grained
  shift-h = 'resize width -10'
  shift-l = 'resize width +10'
  shift-j = 'resize height +10'
  shift-k = 'resize height -10'

  esc   = 'mode main'
  enter = 'mode main'

########################################
### Service Mode
########################################
[mode.service.binding]
  esc = ['reload-config', 'mode main']
  r = ['flatten-workspace-tree', 'mode main']
  b = ['balance-sizes', 'mode main']
  f = ['layout floating tiling', 'mode main']
  backspace = ['close-all-windows-but-current', 'mode main']

  alt-shift-h = ['join-with left', 'mode main']
  alt-shift-j = ['join-with down', 'mode main']
  alt-shift-k = ['join-with up', 'mode main']
  alt-shift-l = ['join-with right', 'mode main']

########################################
### Window Rules: Workspaces
########################################

# Only the first matching rule runs, so exceptions go before app-wide rules
[[on-window-detected]]
  if.app-id = 'app.zen-browser.zen'
  if.window-title-regex-substring = 'Picture-in-Picture'
  run = 'layout floating'

# web (alt-1)
[[on-window-detected]]
  if.app-id = 'app.zen-browser.zen'
  run = 'move-node-to-workspace web'

# notes (alt-2)
[[on-window-detected]]
  if.app-id = 'notion.id'
  run = 'move-node-to-workspace notes'

[[on-window-detected]]
